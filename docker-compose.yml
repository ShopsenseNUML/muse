services:
  postgres:
    image: pgvector/pgvector:pg16

    container_name: shopsense-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: shopsense
      POSTGRES_PASSWORD: shopsense123
      POSTGRES_DB: shopsense

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: shopsense-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
